kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
# Required when helm/kind-action is given both `config` and `registry: true`:
# the action only injects this patch into its own generated config, so a
# user-supplied config must enable the containerd registry config dir itself.
# Without it the hosts.toml files the action writes to the nodes are ignored.
containerdConfigPatches:
- |-
  [plugins."io.containerd.grpc.v1.cri".registry]
    config_path = "/etc/containerd/certs.d"
nodes:
- role: control-plane
  kubeadmConfigPatches:
  - |
    kind: InitConfiguration
    nodeRegistration:
      kubeletExtraArgs:
        node-labels: "ingress-ready=true"

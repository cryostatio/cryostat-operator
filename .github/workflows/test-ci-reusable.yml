on:
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
      repository:
        required: false
        type: string
      ref:
        required: false
        type: string
      sha:
        required: true
        type: string
      
env:
  OPENSUSE_UNOFFICIAL_LIBCONTAINERS_KEY_URL: "https://download.opensuse.org/repositories/devel:/kubic:/libcontainers:/unstable/xUbuntu_22.04/Release.key"
  OPENSUSE_UNOFFICIAL_LIBCONTAINERS_SOURCE_URL: "https://download.opensuse.org/repositories/devel:/kubic:/libcontainers:/unstable/xUbuntu_22.04"

permissions:
  statuses: write

jobs:
  controller-test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        repository: ${{ inputs.repository }}
        ref: ${{ inputs.ref }}
    - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version: '1.26.*'
    - name: Run controller tests
      run: make test-envtest
    - name: Set latest commit status as ${{ job.status }}
      uses: daltonbr/set-commit-status-action@b5ef7ba5279f7953ad1fa44f01f92fca82e65eb4 # v3.0.2
      if: always()
      with:
        sha: ${{ inputs.sha }}
        token: ${{ secrets.GITHUB_TOKEN }}
        status: ${{ job.status }}
        context: ${{ github.job }}
  
  scorecard-test:
    runs-on: ubuntu-latest
    env:
      # Passed to helm/kind-action below, which starts the registry under this name
      # and appends a 127.0.0.1 hosts entry for it, so $REGISTRY_NAME:$REGISTRY_PORT
      # resolves both from the runner host and from within the cluster network.
      REGISTRY_NAME: kind-registry
      REGISTRY_PORT: 5000
      TAG: ${{ inputs.tag }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        repository: ${{ inputs.repository }}
        ref: ${{ inputs.ref }}
    - name: Build scorecard image for test
      run: |
        CUSTOM_SCORECARD_IMG="$REGISTRY_NAME:$REGISTRY_PORT/${{ github.repository_owner }}/cryostat-operator-scorecard:$TAG" \
        PLATFORMS=linux/amd64 \
        MANIFEST_PUSH=false \
        make scorecard-build
    - name: Build operator image for test
      run: |
        OPERATOR_IMG="$REGISTRY_NAME:$REGISTRY_PORT/${{ github.repository_owner }}/cryostat-operator:$TAG" \
        SKIP_TESTS=true \
        make oci-build
    - name: Build bundle image for test
      run: |
        OPERATOR_IMG="$REGISTRY_NAME:$REGISTRY_PORT/${{ github.repository_owner }}/cryostat-operator:$TAG" \
        BUNDLE_IMG="$REGISTRY_NAME:$REGISTRY_PORT/${{ github.repository_owner }}/cryostat-operator-bundle:$TAG" \
        make bundle bundle-build
    - name: Set up Kind cluster
      uses: helm/kind-action@06c1ae10762d3b9c1644e7fe69596ae519e015a2 # v1.15.0
      with:
        config: .github/kind-config.yaml
        cluster_name: ci-${{ github.run_id }}
        wait: 1m
        ignore_failed_clean: true
        # Plain-HTTP registry serving both the runner host and the cluster nodes:
        # operator-sdk 'run bundle' renders the bundle image on the host, while the
        # cluster pulls the operator and scorecard images.
        registry: true
        registry_name: ${{ env.REGISTRY_NAME }}
        registry_port: ${{ env.REGISTRY_PORT }}
        registry_image: quay.io/libpod/registry:2.8.2
    - name: Set up Ingress Controller
      run: |
        # Install nginx ingress controller
        kubectl apply -f https://raw.githubusercontent.com/kubernetes/ingress-nginx/main/deploy/static/provider/kind/deploy.yaml
        kubectl rollout status -w \
          deployment/ingress-nginx-controller \
          -n ingress-nginx --timeout 5m
        
        # Lower the number of worker processes
        kubectl patch cm/ingress-nginx-controller \
          --type merge \
          -p '{"data":{"worker-processes":"1"}}' \
          -n ingress-nginx

        # Modify /etc/hosts to resolve hostnames
        ip_address=$(docker inspect -f '{{range.NetworkSettings.Networks}}{{.IPAddress}}{{end}}' ci-${{ github.run_id }}-control-plane)
        echo "$ip_address testing.cryostat" | sudo tee -a /etc/hosts
    - name: Install Operator Lifecycle Manager
      run: curl -sL https://github.com/operator-framework/operator-lifecycle-manager/releases/download/v0.28.0/install.sh | bash -s v0.28.0
    - name: Install Cert Manager
      run: make cert_manager
    - name: Push test images to local registry
      run: |
        for img in \
          "$REGISTRY_NAME:$REGISTRY_PORT/${{ github.repository_owner }}/cryostat-operator-scorecard:$TAG" \
          "$REGISTRY_NAME:$REGISTRY_PORT/${{ github.repository_owner }}/cryostat-operator:$TAG" \
          "$REGISTRY_NAME:$REGISTRY_PORT/${{ github.repository_owner }}/cryostat-operator-bundle:$TAG"; do
          podman push --tls-verify=false "$img"
        done
    - name: Run scorecard tests
      run: |
        BUNDLE_IMG="$REGISTRY_NAME:$REGISTRY_PORT/${{ github.repository_owner }}/cryostat-operator-bundle:$TAG" \
        SCORECARD_BUNDLE="./bundle" \
        RUN_BUNDLE_EXTRA_ARGS="--use-http --skip-tls" \
        make test-scorecard
    - name: Set latest commit status as ${{ job.status }}
      uses: daltonbr/set-commit-status-action@b5ef7ba5279f7953ad1fa44f01f92fca82e65eb4 # v3.0.2
      if: always()
      with:
        sha: ${{ inputs.sha }}
        token: ${{ secrets.GITHUB_TOKEN }}
        status: ${{ job.status }}
        context: ${{ github.job }}

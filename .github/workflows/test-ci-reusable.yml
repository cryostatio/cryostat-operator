on:
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
      repository:
        required: false
        type: string
      ref:
        required: false
        type: string
      sha:
        required: true
        type: string
      
env:
  OPENSUSE_UNOFFICIAL_LIBCONTAINERS_KEY_URL: "https://download.opensuse.org/repositories/devel:/kubic:/libcontainers:/unstable/xUbuntu_22.04/Release.key"
  OPENSUSE_UNOFFICIAL_LIBCONTAINERS_SOURCE_URL: "https://download.opensuse.org/repositories/devel:/kubic:/libcontainers:/unstable/xUbuntu_22.04"

permissions:
  statuses: write

jobs:
  controller-test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        repository: ${{ inputs.repository }}
        ref: ${{ inputs.ref }}
    - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version: '1.25.*'
    - name: Run controller tests
      run: make test-envtest
    - name: Set latest commit status as ${{ job.status }}
      uses: daltonbr/set-commit-status-action@2a09190f6d04d912bca5ede8094b5d5dce303ebb # v3.0.1
      if: always()
      with:
        sha: ${{ inputs.sha }}
        token: ${{ secrets.GITHUB_TOKEN }}
        status: ${{ job.status }}
        context: ${{ github.job }}
  
  scorecard-test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        repository: ${{ inputs.repository }}
        ref: ${{ inputs.ref }}
    - name: Build scorecard image for test
      run: |
        CUSTOM_SCORECARD_IMG=localhost:5000/${{ github.repository_owner }}/cryostat-operator-scorecard:${{ inputs.tag }} \
        PLATFORMS=linux/amd64 \
        MANIFEST_PUSH=false \
        make scorecard-build
    - name: Build operator image for test
      run: |
        OPERATOR_IMG=localhost:5000/${{ github.repository_owner }}/cryostat-operator:${{ inputs.tag }} \
        SKIP_TESTS=true \
        make oci-build
    - name: Build bundle image for test
      run: |
        OPERATOR_IMG=localhost:5000/${{ github.repository_owner }}/cryostat-operator:${{ inputs.tag }} \
        BUNDLE_IMG=localhost:5000/${{ github.repository_owner }}/cryostat-operator-bundle:${{ inputs.tag }} \
        make bundle bundle-build
    - name: Set up Kind cluster
      uses: helm/kind-action@ef37e7f390d99f746eb8b610417061a60e82a6cc # v1.14.0
      with:
        config: .github/kind-config.yaml
        cluster_name: ci-${{ github.run_id }}
        wait: 1m
        ignore_failed_clean: true
    - name: Set up local image registry
      run: |
        CLUSTER_NAME=ci-${{ github.run_id }}
        # Start a plain-HTTP registry, reachable from the runner host as localhost:5000.
        # operator-sdk 'run bundle' renders the bundle image on the host, so a local
        # registry serves both the host and cluster.
        docker run -d --restart=always -p 5000:5000 --name kind-registry \
          quay.io/libpod/registry:2.8.2
        # Attach the registry to the kind network so cluster nodes can reach it by name.
        docker network connect kind kind-registry
        # Point each node's containerd at the registry for localhost:5000 pulls.
        for node in $(kind get nodes --name "$CLUSTER_NAME"); do
          docker exec "$node" mkdir -p /etc/containerd/certs.d/localhost:5000
          echo '[host."http://kind-registry:5000"]' | \
            docker exec -i "$node" cp /dev/stdin /etc/containerd/certs.d/localhost:5000/hosts.toml
        done
    - name: Set up Ingress Controller
      run: |
        # Install nginx ingress controller
        kubectl apply -f https://raw.githubusercontent.com/kubernetes/ingress-nginx/main/deploy/static/provider/kind/deploy.yaml
        kubectl rollout status -w \
          deployment/ingress-nginx-controller \
          -n ingress-nginx --timeout 5m
        
        # Lower the number of worker processes
        kubectl patch cm/ingress-nginx-controller \
          --type merge \
          -p '{"data":{"worker-processes":"1"}}' \
          -n ingress-nginx

        # Modify /etc/hosts to resolve hostnames
        ip_address=$(docker inspect -f '{{range.NetworkSettings.Networks}}{{.IPAddress}}{{end}}' ci-${{ github.run_id }}-control-plane)
        echo "$ip_address testing.cryostat" | sudo tee -a /etc/hosts
    - name: Install Operator Lifecycle Manager
      run: curl -sL https://github.com/operator-framework/operator-lifecycle-manager/releases/download/v0.28.0/install.sh | bash -s v0.28.0
    - name: Install Cert Manager
      run: make cert_manager
    - name: Push test images to local registry
      run: |
        for img in \
          "localhost:5000/${{ github.repository_owner }}/cryostat-operator-scorecard:${{ inputs.tag }}" \
          "localhost:5000/${{ github.repository_owner }}/cryostat-operator:${{ inputs.tag }}" \
          "localhost:5000/${{ github.repository_owner }}/cryostat-operator-bundle:${{ inputs.tag }}"; do
          podman push --tls-verify=false "$img"
        done
    - name: Run scorecard tests
      run: |
        BUNDLE_IMG="localhost:5000/${{ github.repository_owner }}/cryostat-operator-bundle:${{ inputs.tag }}" \
        SCORECARD_BUNDLE="./bundle" \
        RUN_BUNDLE_EXTRA_ARGS="--use-http --skip-tls" \
        make test-scorecard
    - name: Set latest commit status as ${{ job.status }}
      uses: daltonbr/set-commit-status-action@2a09190f6d04d912bca5ede8094b5d5dce303ebb # v3.0.1
      if: always()
      with:
        sha: ${{ inputs.sha }}
        token: ${{ secrets.GITHUB_TOKEN }}
        status: ${{ job.status }}
        context: ${{ github.job }}

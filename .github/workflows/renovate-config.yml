name: Renovate config

on:
  pull_request:
    paths:
    - '.github/renovate.json'
    - '.github/workflows/renovate-config.yml'

permissions:
  contents: read

jobs:
  renovate-config-validator:
    name: Validate Renovate configuration
    runs-on: ubuntu-latest
    steps:
      - name: Clone the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Name the config file explicitly rather than relying on auto-discovery, which
      # exits 0 after validating nothing if the file is ever moved or renamed. Naming a
      # file makes the validator treat it as self-hosted global config, so --no-global
      # is required to keep validating it as a repository config.
      - name: Run validator
        run: npx --yes --package renovate -- renovate-config-validator --no-global .github/renovate.json

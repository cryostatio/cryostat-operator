# Permissions for Cryostat custom Scorecard tests
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: cryostat-scorecard
  namespace: placeholder
rules:
- apiGroups:
  - ""
  resources:
  - pods
  - events
  verbs:
  - get
  - list
- apiGroups:
  - apps
  resources:
  - deployments
  - replicasets
  verbs:
  - get
  - list
- apiGroups:
  - operator.cryostat.io
  resources:
  - cryostats
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - operator.cryostat.io
  resources:
  - cryostats/finalizers
  verbs:
  - update
- apiGroups:
  - operator.cryostat.io
  resources:
  - cryostats/status
  verbs:
  - get
- apiGroups:
  - ""
  resources:
  - secrets
  verbs:
  - delete
  - get
  - patch
# Permissions for default OAuth configurations
- apiGroups:
  - operator.cryostat.io
  resources:
  - cryostats
  verbs:
  - create
  - patch
  - delete
  - get
- apiGroups:
  - ""
  resources:
  - pods
  - pods/exec
  - services
  verbs:
  - create
  - patch
  - delete
  - get
- apiGroups:
  - discovery.k8s.io
  resources:
  - endpointslices
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - ""
  resources:
  - replicationcontrollers
  verbs:
  - get
- apiGroups:
  - apps
  resources:
  - deployments
  verbs:
  - create
  - get
- apiGroups:
  - apps
  resources:
  - daemonsets
  - replicasets
  - statefulsets
  verbs:
  - get
# Permissions for Agent sample applications, owned by their Cryostat CR.
- apiGroups:
  - cert-manager.io
  resources:
  - certificates
  verbs:
  - create
# Permissions to retrieve container logs
- apiGroups:
  - ""
  resources:
  - pods/log
  verbs:
  - get
# Permissions for the cryostat-rbac test, which builds a privilege ladder of
# ServiceAccounts and masquerades as each one against the Cryostat API.
- apiGroups:
  - ""
  resources:
  - serviceaccounts
  verbs:
  - create
  - delete
  - get
- apiGroups:
  - ""
  resources:
  - serviceaccounts/token
  verbs:
  - create
- apiGroups:
  - rbac.authorization.k8s.io
  resources:
  - roles
  - rolebindings
  verbs:
  - create
  - delete
  - get
# Synthetic resources in the core API group, used as the targets of the Cryostat
# permission mappings the cryostat-rbac test configures.
# The resources do not exist in the API server's resource registry and rely on
# RBAC rule-matching for these synthetic resources.
- apiGroups:
  - ""
  resources:
  - cryostatarchives
  - cryostatrecordings
  - cryostattargets
  - cryostatnothing
  verbs:
  - get
  - update
  - delete
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: cryostat-scorecard
rules:
- apiGroups:
  - console.openshift.io
  resources:
  - consoleplugins
  verbs:
  - get
- apiGroups:
  - operator.openshift.io
  resources:
  - consoles
  verbs:
  - get
- apiGroups:
  - config.openshift.io
  resources:
  - operatorhubs
  verbs:
  - patch
- apiGroups:
  - config.openshift.io
  resources:
  - clusterversions
  verbs:
  - get
  - list
- apiGroups:
  - operators.coreos.com
  resources:
  - operatorgroups
  verbs:
  - create
- apiGroups:
  - operators.coreos.com
  resources:
  - subscriptions
  - clusterserviceversions
  verbs:
  - create
  - get
  - list
  - watch
- apiGroups:
  - ""
  resources:
  - namespaces
  verbs:
  - create
  - delete
- apiGroups:
  - operator.cryostat.io
  resources:
  - cryostats
  verbs:
  - create
  - delete
  - get
